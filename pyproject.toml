[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs-logo-converter"
version = "1.0.0"
description = "Vereinslogos in 144x144-GIFs mit transparentem Hintergrund für Das Fußball Studio (DFS) umwandeln"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "imagequant>=1.1",     # libimagequant: beste Farbpaletten (GPL-3.0)
    "tkinterdnd2>=0.4",    # Drag & Drop in der GUI
    "resvg-py>=0.5",       # SVG-Rendering ohne Systembibliothek
]

[project.optional-dependencies]
svg = ["cairosvg>=2.7"]   # nur Fallback, falls resvg-py fehlt (braucht die Cairo-Bibliothek)
dev = ["pytest>=7", "pyinstaller>=6", "ruff>=0.6"]

[project.scripts]
dfslogo = "dfslogo.cli:main"

[project.gui-scripts]
dfslogo-gui = "dfslogo.gui:main"

[tool.setuptools]
packages = ["dfslogo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:imagequant"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dfslogo", "make_samples"]

[tool.ruff.lint.per-file-ignores]
"tests/make_samples.py" = ["E702"]   # kompakte Einzeiler beim Erzeugen der Testlogos
